<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCAD — Mode Hors Ligne</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #09090b;
      color: #f4f4f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .logo {
      width: 48px;
      height: 48px;
      margin: 0 auto 1.5rem;
      border-radius: 12px;
      border: 1px solid #3f3f46;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      letter-spacing: -1px;
      font-size: 1.1rem;
      color: #fff;
      background: #09090b;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.875rem;
      color: #a1a1aa;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.75rem 1.25rem;
      background: #2563eb;
      color: #ffffff;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 0.75rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">MC</div>
    <h1>Mode hors ligne</h1>
    <p>Aucune connexion internet détectée. L'application se synchronisera automatiquement dès le rétablissement du réseau.</p>
    <button class="btn" onclick="window.location.reload()">Réessayer</button>
  </div>
</body>
</html>
